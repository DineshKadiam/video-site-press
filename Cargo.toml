[workspace]
members = [
	"cli",
	"core",
	"desktop",
	"docs",
	"icons",
	"translations",
	"version",
	"web"
]
resolver = "2"

[workspace.dependencies]
actix-files = "0.6.7"
actix-multipart = "0.7.2"
actix-session = { features = ["cookie-session"], version = "0.11.0" }
actix-web = { version = "4.11.0" }
base64 = "0.22.1"
# bincode 2.x is available but it includes breaking changes (on the API level,
# encoded data is "completely compatible if the same configuration is used")
# and raises the MSRV to 1.85.0, therefore we'll wait a good bit until we
# update (potentially around spring/summer 2026)
bincode = "=1.3.3"
chrono = { features = ["unstable-locales"], version = "0.4.42" }
clap = { features = ["string"], version = "4.5.47" }
ctrlc = "3.5.0"
dirs = "6.0.0"
dunce = "1.0.5"
enolib = { git = "https://codeberg.org/simonrepp/enolib-rs", tag = "0.5.0" }
env_logger = "0.11.8"
# For now included to make sure that on macOS desktop builds,
# ffmpeg/ffprobe is found from $PATH - try to do without in the long run
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs" }
form_urlencoded = "1.2.2"
futures-util = "0.3.31"
icu_collator = "2.0.0"
icu_locale = "2.0.0"
# image 0.25.8 is available but raises the MSRV to 1.85.0, therefore we'll
# wait until we update (no crucial updates we absolutely need here)
image = "=0.25.6"
indoc = "2.0.6"
language-tags = "0.3.2"
local-ip-address = "0.6.5"
log = "0.4.28"
minreq = { features = ["https-rustls"], version = "2.14.1" }
nanoid = "0.4.0"
notify = "8.2.0"
pulldown-cmark = { default-features = false, features = ["html", "simd"], version = "0.13.0" }
rand = "0.9.2"
rsubs-lib = "0.3.3"
serde = "1.0.219"
serde_derive = "1.0.219"
serde_json = "1.0.143"
slug = "0.1.6"
# suppaftp 7.0.x is available but requires an MSRV of 1.85.1, we'll wait a
# good bit (tentatively speaking maybe spring/summer 2026 or so) until we
# update because right now there are no critical fixes or such we need, just
# new/changed features we don't use.
suppaftp = { features = ["native-tls"], version = "=6.3.0" }
sys-locale = "0.3.2"
tauri = { features = [], version = "2.8.5" }
tauri-build = { features = [], version = "2.4.1" }
tauri-plugin-dialog = "2.4.0"
tauri-plugin-opener = "2.5.0"
tokio = { features = ["macros", "rt-multi-thread"], version = "1.47.1" }
url = "2.5.7"
urlencoding = "2.1.3"
uuid = { features = ["v5"], version = "1.18.1" }
webbrowser = "1.0.5"

[workspace.package]
edition = "2021"
rust-version = "1.82"
version = "1.0.0"
