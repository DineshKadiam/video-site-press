[package]
edition = "2021"
name = "hyper8"
version = "0.17.0"

[build-dependencies]
enolib = { git = "https://codeberg.org/simonrepp/enolib-rs", tag = "0.4.2" }
indoc = "2.0.5"
pulldown-cmark = { default-features = false, features = ["html", "simd"], version = "0.12.0" }
slug = "0.1.6"

[dependencies]
actix-files = "0.6.6"
actix-multipart = "0.7.2"
actix-web = "4.9.0"
base64 = "0.22.1"
bincode = "1.3.3"
chrono = { features = ["unstable-locales"], version = "0.4.38" }
clap = { features = ["derive"], version = "4.5.16" }
dirs = "5.0.1"
enolib = { git = "https://codeberg.org/simonrepp/enolib-rs", tag = "0.4.2" }
form_urlencoded = "1.2.1"
futures-util = "0.3.30"
image = "0.25.2"
indoc = "2.0.5"
language-tags = "0.3.2"
minreq = { features = ["https-rustls"], version = "2.12.0" }
nanoid = "0.4.0"
notify = "6.1.1"
rand = "0.8.5"
rsubs-lib = "0.3.2"
serde = "1.0.209"
serde_derive = "1.0.209"
serde_json = "1.0.127"
slug = "0.1.6"
sys-locale = "0.3.1"
tokio = { features = ["macros", "rt-multi-thread"], version = "1.39.3" }
url = "2.5.2"
webbrowser = "1.0.1"
