[package]
edition = "2021"
name = "hyper8"
version = "0.0.0"

[build-dependencies]
enolib = { git = "https://codeberg.org/simonrepp/enolib-rs", tag = "0.4.2" }
indoc = "2.0.4"
pulldown-cmark = { default-features = false, features = ["html", "simd"], version = "0.10.0" }
slug = "0.1.5"

[dependencies]
actix-files = "0.6.5"
actix-multipart = "0.6.1"
actix-web = "4.5.1"
base64 = "0.22.0"
bincode = "1.3.3"
chrono = { features = ["unstable-locales"], version = "0.4.35" }
clap = { features = ["derive"], version = "4.5.3" }
enolib = { git = "https://codeberg.org/simonrepp/enolib-rs", tag = "0.4.2" }
form_urlencoded = "1.2.1"
futures-util = "0.3.30"
image = "0.25.0"
indoc = "2.0.5"
language-tags = "0.3.2"
minreq = { features = ["https-rustls"], version = "2.11.1" }
nanoid = "0.4.0"
notify = "6.1.1"
rand = "0.8.5"
rsubs-lib = "0.1.10"
serde = "1.0.197"
serde_derive = "1.0.197"
serde_json = "1.0.114"
slug = "0.1.5"
sys-locale = "0.3.1"
tokio = { features = ["macros", "rt-multi-thread"], version = "1.36.0" }
url = "2.5.0"
webbrowser = "0.8.13"
