[package]
edition = "2021"
name = "hyper8"
rust-version = "1.80.1"
version = "0.17.1"

[build-dependencies]
enolib = { git = "https://codeberg.org/simonrepp/enolib-rs", tag = "0.5.0" }
indoc = "2.0.5"
pulldown-cmark = { default-features = false, features = ["html", "simd"], version = "0.13.0" }
slug = "0.1.6"

[dependencies]
actix-files = "0.6.6"
actix-multipart = "0.7.2"
actix-web = "4.9.0"
base64 = "0.22.1"
bincode = "1.3.3"
chrono = { features = ["unstable-locales"], version = "0.4.39" }
clap = { features = ["derive"], version = "4.5.29" }
dirs = "6.0.0"
enolib = { git = "https://codeberg.org/simonrepp/enolib-rs", tag = "0.5.0" }
form_urlencoded = "1.2.1"
futures-util = "0.3.31"
image = "0.25.5"
indoc = "2.0.5"
language-tags = "0.3.2"
minreq = { features = ["https-rustls"], version = "2.13.2" }
nanoid = "0.4.0"
notify = "8.0.0"
rand = "0.9.0"
rsubs-lib = "0.3.2"
serde = "1.0.217"
serde_derive = "1.0.217"
serde_json = "1.0.127"
slug = "0.1.6"
sys-locale = "0.3.2"
tokio = { features = ["macros", "rt-multi-thread"], version = "1.43.0" }
url = "2.5.4"
webbrowser = "1.0.3"
