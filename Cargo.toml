[package]
edition = "2021"
name = "hyper8"
rust-version = "1.80.1"
version = "0.20.1"

[build-dependencies]
base64 = "0.22.1"

[dependencies]
actix-files = "0.6.6"
actix-multipart = "0.7.2"
actix-web = "4.10.2"
base64 = "0.22.1"
# bincode 2.x is available but it includes breaking changes (on the API level,
# encoded data is "completely compatible if the same configuration is used")
# and raises the MSRV to 1.85.0 (!) therefore we'll wait a good bit until we
# update.
bincode = "1.3.3"
chrono = { features = ["unstable-locales"], version = "0.4.41" }
clap = { features = ["derive"], version = "4.5.37" }
dirs = "6.0.0"
dunce = "1.0.5"
enolib = { git = "https://codeberg.org/simonrepp/enolib-rs", tag = "0.5.0" }
env_logger = "0.11.8"
form_urlencoded = "1.2.1"
futures-util = "0.3.31"
image = "0.25.6"
indoc = "2.0.6"
language-tags = "0.3.2"
log = "0.4.27"
minreq = { features = ["https-rustls"], version = "2.13.4" }
nanoid = "0.4.0"
notify = "8.0.0"
rand = "0.9.1"
rsubs-lib = "0.3.3"
serde = "1.0.219"
serde_derive = "1.0.219"
serde_json = "1.0.127"
slug = "0.1.6"
suppaftp = { features = ["native-tls"], version = "6.3.0" }
sys-locale = "0.3.2"
tokio = { features = ["macros", "rt-multi-thread"], version = "1.45.0" }
uuid = { features = ["v5"], version = "1.16.0" }
url = "2.5.4"
urlencoding = "2.1.3"
webbrowser = "1.0.4"
