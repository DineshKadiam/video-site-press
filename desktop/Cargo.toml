[package]
description = "The fully graphical Hyper 8 desktop application"
edition.workspace = true
name = "hyper8"
rust-version.workspace = true
version.workspace = true

[lib]
# _lib suffix avoids conflicts with the bin name on Windows
# (https://github.com/rust-lang/cargo/issues/8519)
name = "hyper8_desktop_lib"
crate-type = ["cdylib", "rlib", "staticlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
bincode.workspace = true
dirs.workspace = true
dunce.workspace = true
hyper8-core.path = "../core"
hyper8-web.path = "../web"
serde.workspace = true
serde_derive.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
